name: "Supabase Migrations & Bucket Setup"

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Prepare Supabase token
        run: echo "SUPABASE_ACCESS_TOKEN=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> $GITHUB_ENV

      - name: Login to Supabase CLI
        run: supabase login --token $SUPABASE_ACCESS_TOKEN

      - name: Link project
        run: supabase link --project-ref $SUPABASE_PROJECT_REF

      - name: Deploy migrations (try several commands)
        run: |
          set -e
          echo "Deploying migrations..."
          if command -v supabase >/dev/null 2>&1; then
            supabase migrations deploy --project-ref $SUPABASE_PROJECT_REF || supabase migration deploy --project-ref $SUPABASE_PROJECT_REF || supabase db push --project-ref $SUPABASE_PROJECT_REF
          else
            echo "supabase CLI not found"
            exit 1
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Install @supabase/supabase-js (for bucket setup)
        run: npm install @supabase/supabase-js

      - name: Create storage bucket if not exists
        run: node .github/supabase/create_bucket.js
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
